# live-sim-template-version: 4
# ==============================================================================
# live-sim GitHub Actions Workflow
# ==============================================================================
# This workflow boots an Apple Silicon iOS Simulator in ~60 seconds, dynamically
# installs the exact Expo Go runtime matching your project's Expo SDK version,
# starts serve-sim GPU screen capture + WebSocket control, opens an outbound
# Cloudflare tunnel, and automatically opens your local machine's Metro tunnel URL
# (exps://...) inside the simulator for instant live development.
# ==============================================================================

name: live-sim
run-name: "live-sim ${{ inputs.session }} (${{ inputs.minutes }}m)"

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Session identifier"
        required: true
      gate_token:
        description: "Secret token for auth gate"
        required: true
      local_tunnel_url:
        description: "Local Metro tunnel URL (exps://... or exp://...)"
        default: ""
      minutes:
        description: "Session duration in minutes"
        default: "60"
      device:
        description: "Simulator device name"
        default: "iPhone 16 Pro"
      max_dimension:
        description: "Max pixel dimension for screen stream"
        default: "900"
      video_fps:
        description: "Stream framerate"
        default: "30"
      video_quality:
        description: "MJPEG quality"
        default: "0.7"
      runner:
        description: "Runner image (must be arm64 macOS for serve-sim)"
        default: "macos-15"

permissions:
  contents: read
  statuses: write

concurrency:
  group: live-sim-${{ inputs.session }}
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: live-sim/${{ inputs.session }}
      GATE_PORT: "3199"
      PREVIEW_PORT: "3200"

    steps:
      # Step 1: Checkout repository for gate proxy and workflow files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20 environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Boot the Apple Silicon iOS Simulator
      - name: Boot iOS Simulator
        timeout-minutes: 10
        id: sim
        run: |
          set -euo pipefail
          DEVICE='${{ inputs.device }}'
          echo "Locating simulator for device: $DEVICE"

          UDID=$(xcrun simctl list devices available \
            | grep -F "$DEVICE (" \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)

          if [ -z "$UDID" ]; then
            echo "::warning::$DEVICE not found directly; falling back to newest iPhone"
            UDID=$(xcrun simctl list devices available \
              | grep -E '^\s+iPhone' \
              | tail -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          fi

          [ -n "$UDID" ] || { echo "No iOS simulator available on runner image"; exit 1; }

          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator booted successfully."

      # Step 4: Download and install the exact matching Expo Go runtime for project's SDK
      - name: Install Expo Go
        timeout-minutes: 10
        id: expogo
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          echo "Detecting matching Expo SDK version for simulator $UDID..."

          EXPO_VER=$(node -p "try { const p = require('./package.json'); (p.dependencies?.expo || p.devDependencies?.expo || '57.0.0').replace(/[\^~>=<]/g, ''); } catch(e) { '57.0.0'; }")
          echo "Target Expo SDK version: $EXPO_VER"

          EXPO_GO_URL=$(node -e "
            fetch('https://api.expo.dev/v2/versions')
              .then(r => r.json())
              .then(data => {
                const ver = '$EXPO_VER';
                const major = ver.split('.')[0] + '.0.0';
                const url = data.sdkVersions?.[major]?.iosClientUrl || data.sdkVersions?.[ver]?.iosClientUrl;
                if (url) {
                  console.log(url);
                } else {
                  console.log('https://github.com/expo/expo-go-releases/releases/download/Expo-Go-57.0.9/Expo-Go-57.0.9.tar.gz');
                }
              })
              .catch(() => {
                console.log('https://github.com/expo/expo-go-releases/releases/download/Expo-Go-57.0.9/Expo-Go-57.0.9.tar.gz');
              });
          ")

          echo "Downloading Expo Go archive from: $EXPO_GO_URL"
          mkdir -p /tmp/expogo_raw && cd /tmp/expogo_raw
          curl -fsSL -o Exponent.tar.gz "$EXPO_GO_URL"

          # Extract archive contents
          tar -xzf Exponent.tar.gz

          # Determine the .app bundle directory
          EXPO_APP=$(find /tmp/expogo_raw -maxdepth 3 -type d -name '*.app' | head -1)

          if [ -z "$EXPO_APP" ] && [ -f "/tmp/expogo_raw/Info.plist" ]; then
            # The archive root contains the app bundle contents directly
            mkdir -p /tmp/Exponent.app
            find /tmp/expogo_raw -mindepth 1 -maxdepth 1 ! -name 'Exponent.tar.gz' -exec mv {} /tmp/Exponent.app/ \;
            EXPO_APP="/tmp/Exponent.app"
          fi

          if [ -n "$EXPO_APP" ] && [ -d "$EXPO_APP" ]; then
            echo "Found Expo Go app bundle at: $EXPO_APP"
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$EXPO_APP/Info.plist" 2>/dev/null || echo "host.exp.Exponent")
            echo "Bundle identifier: $BUNDLE_ID"
            echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

            echo "Installing $EXPO_APP onto simulator $UDID..."
            xcrun simctl install "$UDID" "$EXPO_APP"
            echo "Expo Go installed successfully."
          else
            echo "::error::No valid Expo app bundle found in archive"
            ls -la /tmp/expogo_raw
            exit 1
          fi

      # Step 5: Start serve-sim GPU screen capture & WebSocket input server
      - name: Start serve-sim
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ARGS=(
            --detach --quiet
            --port "$PREVIEW_PORT"
            --max-dimension '${{ inputs.max_dimension }}'
            --codec mjpeg
            --mjpeg-fps '${{ inputs.video_fps }}'
            --mjpeg-quality '${{ inputs.video_quality }}'
          )

          echo "Launching serve-sim daemon..."
          npx --yes @expo/serve-sim@latest "${ARGS[@]}"

          # Wait for serve-sim readiness endpoint
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$PREVIEW_PORT/readyz" >/dev/null 2>&1; then
              echo "serve-sim is ready"
              exit 0
            fi
            sleep 2
          done
          echo "serve-sim failed to become ready"
          exit 1

      # Step 6: Start local Auth Gate reverse proxy
      - name: Start Auth Gate
        timeout-minutes: 5
        env:
          LIVE_SIM_GATE_TOKEN: ${{ inputs.gate_token }}
        run: |
          set -euo pipefail
          LIVE_SIM_TARGET_PORT="$PREVIEW_PORT" LIVE_SIM_GATE_PORT="$GATE_PORT" \
            nohup node .github/live-sim/gate.cjs > gate.log 2>&1 &
          disown

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$GATE_PORT/__live-sim/healthz"; then
              echo "Auth gate is active"
              exit 0
            fi
            sleep 1
          done
          cat gate.log; exit 1

      # Step 7: Open Cloudflare tunnel and publish stream URL to GitHub commit status
      - name: Open Cloudflare Tunnel
        timeout-minutes: 10
        id: tunnel
        env:
          GATE_TOKEN: ${{ inputs.gate_token }}
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared.tgz \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf cloudflared.tgz
          chmod +x cloudflared

          nohup ./cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$GATE_PORT" \
            --logfile cloudflared.log > /dev/null 2>&1 &
          disown

          TUNNEL=""
          for _ in $(seq 1 60); do
            TUNNEL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log 2>/dev/null | head -1 || true)
            [ -n "$TUNNEL" ] && break
            sleep 2
          done
          [ -n "$TUNNEL" ] || { echo "cloudflared failed to report tunnel URL"; tail -50 cloudflared.log; exit 1; }

          echo "Discovered tunnel: $TUNNEL"
          echo "Verifying public tunnel reachability before publishing status..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TUNNEL/__live-sim/healthz" || true)
            if [ "$CODE" = "200" ]; then
              echo "Public tunnel is verified healthy (HTTP 200) after ${i} checks!"
              break
            fi
            echo "Waiting for tunnel edge DNS & routing (HTTP $CODE)..."
            sleep 2
          done

          STREAM_URL="$TUNNEL/?k=$GATE_TOKEN"
          echo "url=$STREAM_URL" >> "$GITHUB_OUTPUT"

          # Publish commit status for local CLI discovery
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f "context=$STATUS_CONTEXT" \
            -f "target_url=$TUNNEL" \
            -f "description=Simulator live (Zero-push Live Mode)"

          echo "::notice title=live-sim::$TUNNEL"
          {
            echo "## live-sim"
            echo
            echo "Live iOS Simulator stream is active at \`$TUNNEL\` for ${{ inputs.minutes }} minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 8: Auto-launch Expo Go and connect to the local Metro dev server
      - name: Connect to Local Dev Server
        timeout-minutes: 5
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BUNDLE_ID: ${{ steps.expogo.outputs.bundle_id }}
          TUNNEL_URL: ${{ inputs.local_tunnel_url }}
        run: |
          set -euo pipefail
          APP_ID="${BUNDLE_ID:-host.exp.Exponent}"
          if [ -n "$TUNNEL_URL" ]; then
            echo "Connecting iOS Simulator $UDID to local dev server: $TUNNEL_URL (App ID: $APP_ID)"

            # 1. Warm-up launch of Expo Go
            echo "Launching Expo Go runtime ($APP_ID)..."
            xcrun simctl launch "$UDID" "$APP_ID" || true
            sleep 4

            # 2. Open project URL in Expo Go (supporting both exps:// and exp://)
            echo "Opening $TUNNEL_URL in Expo Go..."
            xcrun simctl openurl "$UDID" "$TUNNEL_URL" || true
            sleep 2

            # If exps:// scheme is used, also try exp:// as alias
            if [[ "$TUNNEL_URL" == exps://* ]]; then
              EXP_ALIAS="${TUNNEL_URL/exps:\/\//exp:\/\/}"
              echo "Opening alias $EXP_ALIAS..."
              xcrun simctl openurl "$UDID" "$EXP_ALIAS" || true
            fi
          else
            echo "No local tunnel URL provided; simulator ready on home screen."
          fi

      # Step 9: Keep runner alive while streaming
      - name: Stream Keep-Alive Loop
        timeout-minutes: 360
        run: |
          set -euo pipefail
          MINUTES=${{ inputs.minutes }}
          END=$(( $(date +%s) + MINUTES * 60 ))
          echo "Keeping live stream open until $(date -r "$END" '+%Y-%m-%d %H:%M:%S')..."

          while [ "$(date +%s)" -lt "$END" ]; do
            curl -fsS -o /dev/null "http://127.0.0.1:$PREVIEW_PORT/healthz" || {
              echo "serve-sim daemon closed; ending session"
              exit 1
            }
            sleep 15
          done
          echo "Stream duration finished."
